name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["src/**", "package.json", "package-lock.json", "vite.config.ts", ".env*", ".github/workflows/deploy.yml"]
  workflow_dispatch:

# Required by actions/deploy-pages for the GitHub Pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; cancel in-flight runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # GitHub Pages has no SPA history fallback; serving index.html as
      # 404.html makes deep links (/editor/:id, /template/:id) reload safely.
      - name: SPA fallback (404.html = index.html)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4